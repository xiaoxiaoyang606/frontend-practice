<!DOCTYPE html>
    <html lang="zh-CN">
<head>
    <meta  charset="UTF-8">
    <meta  name="viewport"  content="width=device-width,  initial-scale=1.0">
    <title>问卷调查</title>
</head>
<body>
    <header>
        <h1>问卷调查</h2>
        <p>你的意见将会影响下一学期的体育课开设课程</p>
    </header>
    <nav>
        <a href="#notice">注意事项</a>
        <a href="#form">开始填写</a>
    </nav>
    <main>
        <section id="notice">
            <h2>注意事项</h2>
            <p>信息仅用于教学，请认真填写！</p>
        </section>
        <section id ="form">
            <h2>调研表单</h2>
            <form  action="#"  method="get">
                <p>
                    <label  for="name">姓名</label>
                    <input  type="text"  id="name"  name="name"    required>
                </p>
                <p>
                    <label for="studentld">学号</label>
                    <input type="text" id="studentld" name="studentld" required>
                </p>
                <p>
                    <label for="major">专业</label>
                    <input type="text" id="major" name="major" required>
                <p>
                    <label  for="mail">邮箱</label>
                    <input  type="email"  id="mail">
               </p>
               <p>运动时间</p>
               <p>
                   <label><input  type="radio"  name="time"  value="morning"  checked>早上</label>
                   <label><input  type="radio"  name="time"  value="afternoon">下午</label>
                   <label><input  type="radio"  name="time"  value="evening">晚上</label>
               </p>
               <p>喜欢的体育课（可多选）</p>
               <p>
                   <label><input  type="checkbox"  name="topic"  value="basketball">篮球</label>
                   <label><input  type="checkbox"  name="topic"  value="badminton">羽毛球</label>
                   <label><input  type="checkbox"  name="topic"  value="running">跑步</label>
                   <label><input  type="checkbox"  name="topic"  value="soccer">足球</label>
                    <label><input  type="checkbox"  name="topic"  value="others">其他</label>
               </p>
               <p>
               <label  for="advice">若有其他问题，填写下面</label><br>
               <textarea  id="advice"  name="advice"  rows="4"  maxlength="128" placeholder="说点什么"></textarea>
               </p>
               <p>
                   <button  type="submit">提交反馈</button>
              </p>
          </form>
        </section>
    </main>
    <footer>
