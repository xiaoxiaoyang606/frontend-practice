<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市天气数据看板</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
    #city-tabs .btn { margin-right: 8px; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">城市天气数据看板</h1>
    <p class="text-muted" id="sub-title">数据加载中…</p>
  </header>

  <p id="status" class="alert alert-warning"></p>

  <div id="city-tabs" class="mb-3"></div>

  <section class="row g-1 mb-4" id="cards"></section>

  <section class="row">
    <div class="col-lg-6">
      <h2 class="h5">本周每日降水量（ECharts 柱状图）</h2>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">本周气温变化（Chart.js 折线图）</h2>
      <div class="chart-box"><canvas id="line-chart"></canvas></div>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/Chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
